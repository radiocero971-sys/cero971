<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Radio CERO FM 97.1</title>
<style>
:root{--accent:#6CC4EA;--muted:#b4bcc0;color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:#000;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;display:flex;flex-direction:column;text-align:center;padding-top:env(safe-area-inset-top,0px);overflow:hidden}
.bg{position:fixed;inset:0;z-index:0}
.bg div{position:absolute;inset:0;background-size:cover;background-repeat:no-repeat;opacity:0;transition:opacity 1.8s ease}
.bg div.on{opacity:1;animation:kb 16s ease-out forwards}
@keyframes kb{from{transform:scale(1.04)}to{transform:scale(1.14)}}
.shade{position:fixed;inset:0;z-index:0;background:linear-gradient(rgba(0,0,0,.55),rgba(0,0,0,.3) 45%,rgba(0,0,0,.8))}
.center{position:relative;z-index:2;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:16px 24px}
.logo{width:min(44vw,170px);border-radius:30px;box-shadow:0 8px 28px rgba(0,0,0,.65)}
h1{margin:14px 0 0;font-size:32px;text-shadow:0 2px 12px #000}h1 span{color:var(--accent)}
.site{color:var(--accent);font-size:14px;margin-top:6px;text-decoration:none}
.soc{display:flex;justify-content:center;gap:26px;margin-top:26px}
.soc a{display:block;width:34px;height:34px;opacity:.9;transition:transform .15s,opacity .15s}
.soc a:active,.soc a:hover{opacity:1;transform:scale(1.15)}
.soc img{width:100%;height:100%;object-fit:contain;display:block}
.dock{position:relative;z-index:3;display:flex;align-items:center;gap:14px;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:rgba(0,0,0,.88);border-top:2px solid var(--accent);backdrop-filter:blur(8px);text-align:left}
.play{flex:none;width:56px;height:56px;border-radius:50%;border:2px solid var(--accent);background:transparent;color:var(--accent);cursor:pointer;display:grid;place-items:center}
.play:active{background:var(--accent);color:#000}
.play svg{width:26px;height:26px;fill:currentColor}
.info{flex:1;min-width:0}
.info b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.info b span{color:var(--accent)}
.live{display:flex;gap:7px;align-items:center;font-size:11px;letter-spacing:.12em;color:var(--muted);margin-top:3px}
.dot{width:8px;height:8px;border-radius:50%;background:#666}
.live.on{color:#fff}.live.on .dot{background:var(--accent);animation:p 1.2s infinite}
@keyframes p{50%{opacity:.3}}
.vol{flex:none;width:min(28vw,120px);accent-color:#6CC4EA}
.msg{font-size:11px;color:var(--muted);margin-top:2px}
@media (prefers-reduced-motion:reduce){.bg div.on{animation:none}}
@media (max-height:600px){.logo{width:96px}h1{font-size:24px}.soc{margin-top:14px}}
</style>
</head>
<body>
<div class="bg" id="bg"></div>
<div class="shade"></div>
<div class="center">
<img class="logo" src="logo.png" alt="Cero">
<h1>97.1 <span>FM</span></h1>
<a class="site" href="https://www.cero.net.ar" target="_blank" rel="noopener">www.cero.net.ar</a>
<div class="soc" id="soc"></div>
</div>
<div class="dock">
<button class="play" id="btn" aria-label="Reproducir"><svg id="ico" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg></button>
<div class="info"><b>Radio CERO <span>97.1 FM</span></b><div class="live" id="live"><span class="dot"></span><span id="st">EN VIVO · VILLA CARLOS PAZ</span></div></div>
<input class="vol" type="range" id="vol" min="0" max="1" step="0.05" value="0.8" aria-label="Volumen">
</div>
<script>
/* ====== CONFIGURACIÓN: completá los links de las redes de CERO ====== */
var STREAM="https://radio01.ferozo.com/proxy/ra01001235?mp=/stream";
var SOCIAL=[
 {n:"Instagram",i:"icon-instagram.png",u:"https://www.instagram.com/"},
 {n:"TikTok",i:"icon-tiktok.png",u:"https://www.tiktok.com/"},
 {n:"WhatsApp",i:"icon-whatsapp.png",u:"https://wa.me/"},
 {n:"YouTube",i:"icon-youtube.png",u:"https://youtu.be/DNM6dHbGJkU"}
];
/* ==================================================================== */
var $=function(i){return document.getElementById(i)};
$("soc").innerHTML=SOCIAL.map(function(s){return '<a href="'+s.u+'" target="_blank" rel="noopener" aria-label="'+s.n+'"><img src="'+s.i+'" alt="'+s.n+'"></a>'}).join("");
/* Fondo de fotos */
var PH=[["bg1.jpg","35% center"],["bg2.jpg","30% center"],["bg3.jpg","50% center"]],bgE=$("bg"),cur=0;
PH.forEach(function(p){var d=document.createElement("div");d.style.backgroundImage="url("+p[0]+")";d.style.backgroundPosition=p[1];bgE.appendChild(d)});
var ds=bgE.children;ds[0].className="on";
setInterval(function(){ds[cur].className="";cur=(cur+1)%ds.length;ds[cur].className="on"},8000);
/* Reproductor */
var btn=$("btn"),ico=$("ico"),live=$("live"),st=$("st"),vol=$("vol"),IDLE="EN VIVO · VILLA CARLOS PAZ";
var a=null,playing=false,busy=false;
var PL="M8 5v14l11-7z",PA="M6 5h4v14H6zM14 5h4v14h-4z";
function ui(p){playing=p;ico.innerHTML='<path d="'+(p?PA:PL)+'"/>';live.classList.toggle("on",p);btn.setAttribute("aria-label",p?"Pausar":"Reproducir");if("mediaSession"in navigator)navigator.mediaSession.playbackState=p?"playing":"paused"}
function stop(){if(a){a.pause();a.removeAttribute("src");a.load();a=null}st.textContent=IDLE;ui(false)}
async function start(){
 busy=true;st.textContent="CONECTANDO…";
 try{a=new Audio();a.preload="none";a.volume=+vol.value;a.src=STREAM;await a.play()}
 catch(e){a=null;busy=false;st.textContent="NO SE PUDO REPRODUCIR";ui(false);return}
 busy=false;st.textContent=IDLE;ui(true);
 if("mediaSession"in navigator){navigator.mediaSession.metadata=new MediaMetadata({title:"Radio CERO FM 97.1",artist:"En vivo",artwork:[{src:"icon-512.png",sizes:"512x512",type:"image/png"}]});navigator.mediaSession.setActionHandler("pause",stop);navigator.mediaSession.setActionHandler("play",start)}
}
btn.onclick=function(){if(busy)return;playing?stop():start()};
vol.oninput=function(){if(a)a.volume=+vol.value};
if("serviceWorker"in navigator)addEventListener("load",function(){navigator.serviceWorker.register("sw.js").catch(function(){})});
</script>
</body>
</html>
